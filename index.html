<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Quiz Game</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Poppins;
    background:linear-gradient(135deg,#667eea,#764ba2,#ff6a00);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:520px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
    color:#222;
}

/* TIMER + PROGRESS */
.timer{
    margin:10px 0;
    color:#444;
}

.progress{
    height:8px;
    background:#eee;
    border-radius:10px;
    margin-bottom:10px;
}
.bar{
    height:100%;
    width:0%;
    background:#6c5ce7;
}

/* BUTTON */
button{
    padding:10px 15px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#6c5ce7;
    color:#fff;
    font-weight:600;
}
button:hover{background:#4834d4}

/* OPTION */
.option{
    text-align:left;
    margin:8px 0;
}

/* INPUT */
input[type="text"]{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    outline:none;
}

/* RESULT */
.result{
    font-size:22px;
    font-weight:bold;
}

/* REVIEW BOX */
.reviewBox{
    max-height:300px;
    overflow-y:auto;
    text-align:left;
    margin-top:10px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}
.bad{
    background:#ffe5e5;
    padding:8px;
    margin:5px 0;
    border-radius:6px;
}
.good{
    background:#e5ffe5;
    padding:8px;
    margin:5px 0;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="container">

<!-- START -->
<div id="start">
    <h2>Interactive Quiz Game</h2>
    <p><< This contains 10 questions with 1 mark each.</p>
    <p><< Attempt all question to test your knowledge.</p>
    <p style="font-weight:bolder">Keep Learning</p>
    <button onclick="startQuiz()">Start</button>
</div>

<!-- QUIZ -->
<div id="quiz" style="display:none">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="timer" id="timer"></div>
    <h3 id="q"></h3>
    <div id="opt"></div>
    <button onclick="next()">Next</button>
</div>

<!-- RESULT -->
<div id="result" style="display:none">
    <h2 class="result" id="score"></h2>

    <button onclick="showStats()">📊 Result</button>
    <button onclick="showReview()">🔍 Review Mistakes</button>
    <button onclick="location.reload()">Restart</button>

    <div id="stats"></div>
    <div id="review" class="reviewBox"></div>
</div>

</div>

<script>

let rawQuestions=[
{t:"single",q:"Which tag is used for largest heading in HTML?",o:["h6","h1","head","title"],a:[1]},
{t:"multi",q:"Select frontend technologies from given options",o:["HTML","CSS","Node.js","JavaScript"],a:[0,1,3]},
{t:"fill",q:"CSS stands for _ ",a:"Cascading Style Sheets"},
{t:"single",q:"Which language runs in browser?",o:["Python","C","JavaScript","Java"],a:[2]},
{t:"multi",q:"Select databases from the below options",o:["MySQL","MongoDB","React","PostgreSQL"],a:[0,1,3]},
{t:"single",q:"Which is NOT a programming language?",o:["HTML","Python","Java","C++"],a:[0]},
{t:"fill",q:"HTML stands for _",a:"Hyper Text Markup Language"},
{t:"single",q:"Which is a styling language?",o:["HTML","CSS","Python","C"],a:[1]},
{t:"multi",q:"Select backend tools from below options",o:["Node.js","Django","React","Flask"],a:[0,1,3]},
{t:"single",q:"Which symbol is used for comments in JavaScript?",o:["//","##","**","#"],a:[0]}
];

// shuffle questions
rawQuestions.sort(()=>Math.random()-0.5);

let i=0,score=0,timer,sec=15;
let resultData=[];

function startQuiz(){
document.getElementById("start").style.display="none";
document.getElementById("quiz").style.display="block";
load();
}

function load(){
clearInterval(timer);
sec=15;

document.getElementById("timer").innerText="Time: "+sec;

timer=setInterval(()=>{
sec--;
document.getElementById("timer").innerText="Time: "+sec;
if(sec===0) next(true);
},1000);

let q=rawQuestions[i];
document.getElementById("q").innerText=q.q;
document.getElementById("opt").innerHTML="";

document.getElementById("bar").style.width=(i/rawQuestions.length)*100+"%";

if(q.t==="single"){
q.o.forEach((x,idx)=>{
document.getElementById("opt").innerHTML+=`
<div class="option"><input type="radio" name="o" value="${idx}"> ${x}</div>`;
});
}

else if(q.t==="multi"){
q.o.forEach((x,idx)=>{
document.getElementById("opt").innerHTML+=`
<div class="option"><input type="checkbox" value="${idx}"> ${x}</div>`;
});
}

else{
document.getElementById("opt").innerHTML=
`<input autocomplete="off" type="text" id="fill" placeholder="Type answer here">`;
}
}

function next(auto=false){

clearInterval(timer);

let q=rawQuestions[i];
let attempted=false;
let correct=false;

if(q.t==="single"){
let sel=document.querySelector('input[name="o"]:checked');
if(sel){
attempted=true;
correct=q.a.includes(+sel.value);
}
}

else if(q.t==="multi"){
let sel=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>+x.value);
if(sel.length>0) attempted=true;
if(JSON.stringify(sel.sort())===JSON.stringify(q.a.sort())) correct=true;
}

else{
let val=document.getElementById("fill").value.trim().toLowerCase();
if(val.length>0) attempted=true;
if(val===q.a.toLowerCase()) correct=true;
}

if(correct) score++;

resultData.push({
q:q.q,
attempted,
correct,
answer:q.t==="fill"?q.a:q.o.filter((_,idx)=>q.a.includes(idx)).join(", ")
});

i++;

if(i<rawQuestions.length) load();
else showResult();
}

function showResult(){
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";

document.getElementById("score").innerText=
`Score: ${score} / ${rawQuestions.length}`;
}

function showStats(){
let attempted=resultData.filter(x=>x.attempted).length;
let unattempted=rawQuestions.length-attempted;
let wrong=rawQuestions.length-score;

document.getElementById("stats").innerHTML=`
<p>Attempted: ${attempted}</p>
<p>Unattempted: ${unattempted}</p>
<p>Correct: ${score}</p>
<p>Wrong: ${wrong}</p>`;
}

function showReview(){
let html="";
resultData.forEach(x=>{
if(!x.correct){
html+=`
<div class="bad">
<b>Q:</b> ${x.q}<br>
<b>Correct Answer:</b> ${x.answer}
</div>`;
}
});

document.getElementById("review").innerHTML=html || "No mistakes 🎉";
}

</script>

</body>
</html>
